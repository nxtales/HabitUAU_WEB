trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    persistCredentials: true  # Isso mantém as credenciais do Git

  - script: |
      git config --global user.email "natthaliebohm@hotmail.com"
      git config --global user.name "Natthalie - Azure Pipelines"
      git fetch origin
      git checkout HabitUAU_DEV
      git checkout -b HabitUAU_QA  # -B força a recriação da branch QA
      git push origin HabitUAU_QA --force  # Força o push para HabitUAU_QA
    displayName: 'Forçar clone de HabitUAU_DEV para HabitUAU_QA'
