# Define que o pipeline não será disparado automaticamente
trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    persistCredentials: true  # Isso mantém as credenciais do Git

  # Clona a branch HabitUAU_DEV e cria a HabitUAU_QA
  - script: |
      git config --global user.email "natthaliebohm@hotmail.com"
      git config --global user.name "Natthalie - Azure DevOps Pipelines"
      git fetch origin
      git checkout HabitUAU_DEV
      git checkout -b HabitUAU_QA
      git push origin HabitUAU_QA
    displayName: 'Clonar HabitUAU_DEV para HabitUAU_QA'
